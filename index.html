<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流星雨 · 许愿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 30%, #0b1a2e, #03070f);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .star-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            z-index: 0;
            pointer-events: none;
        }

        .hint {
            position: relative;
            z-index: 2;
            color: rgba(255, 255, 255, 0.5);
            font-size: clamp(0.9rem, 3vw, 1.4rem);
            letter-spacing: 2px;
            text-align: center;
            padding: 1.5rem 3rem;
            border-radius: 60px;
            background: rgba(10, 20, 40, 0.25);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 240, 200, 0.15);
            box-shadow: 0 0 40px rgba(0, 180, 255, 0.1);
            animation: breathe 4s infinite alternate ease-in-out;
            pointer-events: none;
            user-select: none;
            font-weight: 300;
            text-shadow: 0 0 12px rgba(255, 255, 200, 0.3);
        }

        @keyframes breathe {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        .click-hint {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.85rem;
            z-index: 2;
            pointer-events: none;
            letter-spacing: 2px;
            animation: fadeHint 3s infinite alternate ease-in-out;
        }

        @keyframes fadeHint {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
